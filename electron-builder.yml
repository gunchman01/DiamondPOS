# electron-builder turns the built app into a Windows installer (.exe)
# and publishes it to GitHub Releases.
appId: com.diamondpos.app
productName: DiamondPOS
directories:
  buildResources: build
  output: dist
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!docs/*"
  - "!scripts/*"
  - "!{CHANGELOG.md,CLAUDE.md}"
  - "!electron.vite.config.*"
  - "!{.gitignore,.gitattributes,README.md}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
# Native modules (the SQLite driver) must live outside the asar archive
asarUnpack:
  - "**/*.node"
win:
  target: nsis
  # No spaces in the file name: GitHub renames spaces, which breaks updates.
  artifactName: diamondpos-setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
publish:
  provider: github
  # >>> CHANGE THESE to your GitHub account/org and repository name <<<
  # They must match GITHUB_OWNER / GITHUB_REPO in src/shared/constants.ts
  # Test Update
  owner: gunchman01
  repo: DiamondPOS
  releaseType: release
