# Builds the Windows installer and publishes it to GitHub Releases
# whenever you push a version tag, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0        -> stable release
#   git tag v0.3.0-beta.1 && git push origin v0.3.0-beta.1  -> beta (pre-release)
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set app version from the tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Type check
        run: npm run typecheck

      - name: Build installer and publish to GitHub Releases
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing (recommended before going live) - add these repo secrets:
          # CSC_LINK: ${{ secrets.WINDOWS_CERT_BASE64 }}
          # CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

      - name: Release notes from CHANGELOG.md (shown on the app's Updates screen)
        shell: bash
        run: |
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark beta versions as pre-release
        if: contains(github.ref_name, '-')
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
